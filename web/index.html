  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

<body>
  <script>
    // Disable browser right-click context menu (Flutter handles its own)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- ─────────────────────────────────────────────────────────────────────
       NY VERSJON-VARSEL

       Flutter skriver version.json ved hvert web-bygg. Vi leser den ved
       oppstart, husker hva denne fanen faktisk kjører, og sjekker igjen med
       jevne mellomrom. Er den endret, ligger det en nyere utgave på serveren.

       Sjekken går utenom service worker-cachen (no-store + cache-buster),
       ellers ville vi bare lest vår egen gamle kopi. Og oppdateringen tømmer
       cachen og avregistrerer service workeren før den laster på nytt — en
       vanlig reload ville servert den gamle appen om igjen.
       ───────────────────────────────────────────────────────────────────── -->
  <style>
    #tf-update-bar {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 2147483647;
      display: none;
      align-items: center;
      gap: 14px;
      max-width: calc(100vw - 40px);
      padding: 14px 16px 14px 18px;
      background: #1a1a1a;
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
      font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #tf-update-bar .tf-text { display: flex; flex-direction: column; }
    #tf-update-bar .tf-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
    #tf-update-bar button {
      font: 700 14px/1 inherit;
      border: 0;
      cursor: pointer;
      border-radius: 9px;
    }
    #tf-update-bar .tf-go {
      background: #fff;
      color: #1a1a1a;
      padding: 10px 16px;
    }
    #tf-update-bar .tf-dismiss {
      background: transparent;
      color: #888;
      padding: 10px 4px;
      font-weight: 500;
    }
  </style>
  <div id="tf-update-bar" role="status">
    <div class="tf-text">
      <span>Ny versjon tilgjengelig</span>
      <span class="tf-sub">Trykk for å oppdatere</span>
    </div>
    <button class="tf-go" id="tf-update-go">Oppdater</button>
    <button class="tf-dismiss" id="tf-update-later">Senere</button>
  </div>

  <script>
  (function () {
    var CHECK_EVERY_MS = 5 * 60 * 1000;
    var running = null;    // version this tab is actually running
    var dismissed = null;  // version the user chose to skip

    // Fingerprint of what is on the server right now.
    //
    // ETag on the app bundle rather than version.json: version.json only
    // changes when the version in pubspec is bumped, so a deploy without a
    // bump would tell nobody. The ETag changes on every build, so this needs
    // no discipline at deploy time. Falls back to version.json if the host
    // sends neither ETag nor Last-Modified.
    function readVersion() {
      return fetch('flutter_bootstrap.js?t=' + Date.now(), {
        method: 'HEAD',
        cache: 'no-store',
      })
        .then(function (r) {
          if (!r.ok) return null;
          var tag = r.headers.get('etag') || r.headers.get('last-modified');
          return tag || readVersionJson();
        })
        .catch(function () { return null; });  // offline — try again later
    }

    function readVersionJson() {
      return fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j) return null;
          return (j.version || '') + '+' + (j.build_number || '');
        })
        .catch(function () { return null; });
    }

    function show() { document.getElementById('tf-update-bar').style.display = 'flex'; }
    function hide() { document.getElementById('tf-update-bar').style.display = 'none'; }

    function check() {
      readVersion().then(function (latest) {
        if (!latest) return;
        if (!running) { running = latest; return; }
        if (latest !== running && latest !== dismissed) show();
      });
    }

    document.getElementById('tf-update-go').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Oppdaterer…';

      var jobs = [];
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
      }
      // Reload regardless — a failed cleanup must not leave the user stuck.
      Promise.all(jobs).catch(function () {}).then(function () {
        location.reload();
      });
    });

    document.getElementById('tf-update-later').addEventListener('click', function () {
      readVersion().then(function (latest) { dismissed = latest; });
      hide();
    });

    check();
    setInterval(check, CHECK_EVERY_MS);
    // Coming back to the tab is when a stale version is most likely.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') check();
    });
  })();
  </script>
</body>
</html>
